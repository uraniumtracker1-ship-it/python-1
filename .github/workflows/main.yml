name: Uranium Stock Pipeline 1
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium via playwright or direct deb (snap-free)
        run: |
          # Install chromium from the Ubuntu chromium-browser PPA (not snap)
          sudo add-apt-repository ppa:phd/chromium-browser -y
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          
          # Verify
          chromium-browser --version
          chromedriver --version || /usr/lib/chromium-browser/chromedriver --version

      - name: Run pipeline
        run: python app.py
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
